name: Build FlipRPI iPhone BLE
on:
  push:
    branches:
      - build/fliprpi-iphone-input
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Fetch sources
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/jblanked/FlipRPI.git FlipRPI
          git clone --depth 1 https://github.com/Next-Flip/Momentum-Apps.git Momentum-Apps
          mkdir -p FlipRPI/ble_serial
          cp Momentum-Apps/pc_monitor/helpers/ble_serial.c FlipRPI/ble_serial/ble_serial.c
          cp Momentum-Apps/pc_monitor/helpers/ble_serial.h FlipRPI/ble_serial/ble_serial.h
          python3 tools/patch_fliprpi.py
          grep -nE 'FlipRPICustomEventBLE|flip_rpi_ble_start|BLE -> UART' FlipRPI/app.c

      - name: Fetch Momentum firmware
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch release --recurse-submodules --shallow-submodules https://github.com/Next-Flip/Momentum-Firmware.git Momentum-Firmware
          ln -s "$GITHUB_WORKSPACE/FlipRPI" "$GITHUB_WORKSPACE/Momentum-Firmware/applications_user/flip_rpi"

      - name: Build FAP
        run: |
          set -euxo pipefail
          cd Momentum-Firmware
          ./fbt fap_flip_rpi
          FAP="$(find build -path '*/.extapps/flip_rpi.fap' -print -quit)"
          test -n "$FAP"
          test -f "$FAP"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$FAP" "$GITHUB_WORKSPACE/out/flip_rpi_iphone_ble_momentum.fap"
          ls -lh "$GITHUB_WORKSPACE/out/flip_rpi_iphone_ble_momentum.fap"

      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: flip-rpi-iphone-ble-momentum
          path: out/flip_rpi_iphone_ble_momentum.fap
          if-no-files-found: error
          retention-days: 7
