name: Publish v0.2.1

on:
  push:
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean release commit
        uses: actions/checkout@v4
        with:
          ref: 7f3a039967eccac885d3476686b14b86965e83c6

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.2.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target 7f3a039967eccac885d3476686b14b86965e83c6 \
              --title "v0.2.1" \
              --notes-file RELEASE_NOTES_v0.2.1.md
          fi

      - name: Build Flipper FAP with uFBT
        id: build_fap
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade ufbt
          export PATH="$HOME/.local/bin:$PATH"
          cd flipper
          ./build.sh
          FAP="$(find dist -maxdepth 1 -type f -name '*.fap' -print -quit)"
          test -n "$FAP"
          cp "$FAP" ../pwnagotchi_companion.fap

      - name: Upload FAP asset
        if: steps.build_fap.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload v0.2.1 pwnagotchi_companion.fap --repo "$GITHUB_REPOSITORY" --clobber
